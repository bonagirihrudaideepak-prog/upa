databases:
  - name: upanishad-store-db
    plan: free
    databaseName: upanishad
    user: upanishad

services:
  - type: web
    name: upanishad-store
    env: node
    buildCommand: npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: upanishad-store-db
          property: connectionString