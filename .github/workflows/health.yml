name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  health:
    name: Uptime & Health Probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe health endpoint
        id: probe
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 https://upanishadmobiles.com/api/health || echo 000)
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with HTTP $code"
            exit 1
          fi

      - name: Probe SPA
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://upanishadmobiles.com/ || echo 000)
          echo "SPA root: HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::SPA check failed"; exit 1; fi

      - name: Notify on failure (via repository issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Health check FAILED',
              body: `Probe to https://upanishadmobiles.com failed at ${new Date().toISOString()}. Run: ${context.runId}`
            });
